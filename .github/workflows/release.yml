name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This package depends on kirimi/kirimi-php, which may not be on
      # Packagist yet at tag time. Check the sibling repo out and point the
      # path repository at it so tests run against the current source.
      - uses: actions/checkout@v4
        with:
          repository: kiriminow/kirimi-php
          path: kirimi-php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: point at the sibling kirimi-php checkout
        run: |
          composer config --unset repositories || true
          composer config repositories.kirimi-php '{"type":"path","url":"kirimi-php"}'

      - run: composer install --prefer-dist --no-progress
      - run: composer test

      - name: notify packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "Packagist credentials not set, relying on the tag webhook"
            exit 0
          fi
          curl -sfS -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}"
          echo "Packagist update requested"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
